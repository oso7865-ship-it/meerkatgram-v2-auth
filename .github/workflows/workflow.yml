# Actions 탭 목록에 표시될 워크플로우명(자유롭게 지정 가능)
name: AUTH Build And Deploy

# 이벤트 트리거 정의
on:
  # `push 이벤트가 발생`하면 트리거
  push:
    # 그 중에서 master 브런치만 push 되었을 때 (다른 브런치 push는 무시)
    branches: [master]

env:
  # ghcr.io에 올릴 이미지명 설정
  IMAGE_NAME: auth

  # k8s-manifests 안에서 deployment.yaml이 있는 폴더
  MANIFEST_PATH: auth

  # 자동으로 수정할 매니페스트 저장소
  MANIFEST_REPO: oso7865-ship-it/msa4-k8s-manifest

# 해당 워크플로우가 실행 중 GITHUB_TOKEN에 부여할 권한 설정
permissions:
  # 해당 레포 코드를 checkout하기 위한 최소 조건
  contents: read
  # ghcr.io(Github Packages)에 이미지를 push하기위한 권한
  packages: write

jobs:
  # job의 id(임의로 지정 가능, actions 로그에 표시)
  build-and-push:
    # 해당 job을 실행할 GitHub 호스팅 러너의 OS 이미지
    runs-on: ubuntu-22.04
    steps:
      # Actions 로그에 표시될 step명
      - name: Checkout
        # 현재 레포 코드를 러너로 내려받는 공식 액션
        uses: actions/checkout@v7
        
      - name: Login to ghcr.io
        # Docker 레지스트리 로그인을 대신 처리해주는 공식 앤션
        uses: docker/login-action@v4
        with:
          # 로그인할 대상 레지스트리 주소
          registry: ghcr.io
          # 이 워크플로우를 트리거한, 사용자의 GitHubId
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME
          docker build -t $IMAGE:$GITHUB_RUN_NUMBER .
          docker push $IMAGE:$GITHUB_RUN_NUMBER
      # 별도 저장소인 k8s-manifest를 Runner로 내려받음
      - name: Checkout k8s-manifest
        uses: actions/checkout@v7
        with:
          # 수정할 Kubernetes 매니패스트 저장소
          repository: ${{ env.MANIFEST_REPO }}
          # k8s-manifest에 Pushㅘㅎ 수 있는 PAT
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          # 내려받은 저장소를 manifest 폴더에 저장
          path: manifest
          # Commit과 Push 작업을 위해 Git 기록을 모두 가져옴
          fetch-depth: 0
      # deployment.yaml의 이미지 태그를 변경하고 자동 Push
      - name: Update manifest image tag
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME
          FILE="manifest/${MANIFEST_PATH}/deployment.yaml"

          if [ ! -f "$FILE" ]; then
            echo "::error::매니페스트 파일을 찾을 수 없습니다: $FILE"
            exit 1
          fi

          sed -i -E \
            "s#(image:[[:space:]]*)${IMAGE}:[^[:space:]\"']+#\1${IMAGE}:${GITHUB_RUN_NUMBER}#" \
            "$FILE"

          if ! grep -qF "${IMAGE}:${GITHUB_RUN_NUMBER}" "$FILE"; then
            echo "::error::이미지 태그 변경에 실패했습니다."
            grep -n "image:" "$FILE" || true
            exit 1
          fi

          grep -n "image:" "$FILE"

          cd manifest

          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${MANIFEST_PATH}/deployment.yaml"

          if git diff --cached --quiet; then
            echo "변경된 매니페스트가 없습니다."
            exit 0
          fi
          git commit -m "Deploy ${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"
          git pull --rebase
          git push